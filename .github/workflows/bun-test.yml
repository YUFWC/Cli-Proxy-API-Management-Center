name: Bun Test

on:
  # Run tests on PRs to verify code doesn't break before merge
  pull_request:
    types: [opened, synchronize]
    # Your production branch. If not the default, update here and set Target Branch at https://gitauto.ai/dashboard/rules to match
    branches: [feature/dev]
    paths:
      - 'src/**/*.ts'
      - 'src/**/*.tsx'
      - 'tests/**/*.ts'
      - 'tests/**/*.tsx'
      - package.json
      - bun.lock
      - '!.github/workflows/**'
  # Run tests after merge and collect coverage as canonical source of truth
  push:
    # Your production branch. If not the default, update here and set Target Branch at https://gitauto.ai/dashboard/rules to match
    branches: [feature/dev]
    paths:
      - 'src/**/*.ts'
      - 'src/**/*.tsx'
      - 'tests/**/*.ts'
      - 'tests/**/*.tsx'
      - package.json
      - bun.lock
  # Allow manual trigger for debugging
  workflow_dispatch:

# Cancel older runs when new commits are pushed to the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Matches packageManager in package.json and the version ci.yml installs with
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bun test
          else
            bun test --coverage --coverage-reporter=lcov --coverage-dir=coverage
          fi

      - name: Upload coverage report
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.info
